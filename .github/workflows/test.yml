name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # ponytail: unpinned CLI, pin the version if a release breaks CI
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin test .
